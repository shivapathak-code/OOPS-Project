
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RideNow | Book Your Ride</title>

    <!-- Bootstrap CSS -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark px-4">
    <a class="navbar-brand fw-bold" href="#">RideNow</a>
    <span class="text-white">Your ride, your way</span>
</nav>

<!-- Booking Section -->
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">

            <div class="card booking-card shadow p-4">
                <h2 class="fw-bold mb-2">Book a Ride</h2>
                <p class="text-secondary">
                    Enter your pickup and destination.
                </p>

                <form id="rideForm">

                    <label for="pickup" class="form-label">
                        Pickup Location
                    </label>

                    <input
                            type="text"
                            id="pickup"
                            class="form-control mb-3"
                            placeholder="Enter pickup location"
                            required>

                    <label for="destination" class="form-label">
                        Destination
                    </label>

                    <input
                            type="text"
                            id="destination"
                            class="form-control mb-3"
                            placeholder="Where do you want to go?"
                            required>

                    <label for="rideType" class="form-label">
                        Choose Ride
                    </label>

                    <select id="rideType"
                            class="form-select mb-4">
                        <option value="base">RideNow Standard</option>
                        <option value="premium">RideNow Premium</option>
                    </select>

                    <button type="submit"
                            class="btn btn-primary w-100">
                        Book Ride
                    </button>

                </form>

                <div id="result"
                     class="alert alert-info mt-4 d-none">
                </div>
            </div>

        </div>
    </div>
</div>

<!-- JavaScript -->
<script src="app.js"></script>

</body>
</html>
